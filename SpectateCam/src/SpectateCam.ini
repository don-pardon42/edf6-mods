[SpectateCam]
; Keys: a single character or a virtual-key code (0xBB, 187).
NextKey==
PrevKey=-
SelfKey=0
; Turns debug mode on/off: switching works at any time, not only after death.
DebugKey=9
; 1 = start with debug mode already on
DebugAtStart=0
; 1 = give NPCs the same camera offset as the player (experimental)
NpcPlayerCamera=1
; 1 = show the list of soldiers in a separate console window (use borderless/windowed mode)
Console=1
