[MortarCam]
; Key that switches the raised artillery camera: a letter (B) or a virtual-key code (0x05 = mouse button 4).
Key=B
; 0 = the key toggles the camera on/off, 1 = the camera is raised only while the key is held
HoldKey=0
; 1 = only while a mortar is equipped (see MortarNames), 0 = with any weapon (for tests)
OnlyWithMortar=1
; Parts of weapon names that count as mortars, comma separated, case does not matter (UTF-8).
MortarNames=Mortar
; Where the camera looks and where it stands, relative to the character (x right, y up, z forward), metres.
; Defaults are the game's own Air Raider bomber view.
LookOffset=0,35,0
CameraOffset=0,70,-140
; Extra downward/upward camera rotation in degrees (experimental, 0 = off). Try -30 and 30.
TiltDegrees=0
; Time to raise the camera, seconds
BlendSeconds=0.33
; Gravity used for the predicted shell flight in the log (m/s^2)
Gravity=9.8
; Reconnaissance log: weapon slots and states (1 = on), maximum number of such lines per character,
; and how often (ms) the predicted impact point is written while the camera is switched on (0 = never).
ProbeLog=1
ProbeLimit=400
StatusMs=1000
