[SquadSync]
; IPv4 addresses of the OTHER players (Radmin VPN / ZeroTier / LAN), comma separated, optional :port
; Example: Peers=26.10.20.30, 26.10.20.31:27778
Peers=
; UDP port this game listens on (allow it in Windows Firewall)
Port=27777
; Position packets per second
SendRate=30
; 0 = only measure the error and write it to SquadSync.log, 1 = correct positions
Apply=1
; Error (metres) the game's own sync is allowed before correction kicks in
Deadzone=1.0
; Share of the error removed per frame (0.01..1); lower = smoother, higher = tighter
Blend=0.25
; Errors larger than this (metres) teleport the character instead of blending
SnapDistance=15
; Extrapolate the received position by this many seconds on top of the packet age
LeadTime=0.05
; Stop correcting a player if no packets arrive for this long
TimeoutMs=1000
; 1 = match players by slot + class first, then by nearest character of the same class
MatchBySlot=1
MatchRadius=60
; Turn correction on/off in game (virtual-key code, 0x77 = F8)
ToggleKey=0x77
