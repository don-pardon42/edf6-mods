[EDFStats]
; Your name in the reports (any language). Empty = your Steam profile name
Name=
; 1 = send stats through the game's own online connection (no IPs needed; every player needs EDFStats)
ShareViaGame=1
; interface language of the overlay and reports: auto (from Windows), ru, en
Language=auto
; Optional extra channel: IPv4 addresses of the OTHER players (LAN / Radmin / ZeroTier), comma separated.
; Empty = the Peers line from SquadSync.ini is used, if there is one.
Peers=
; UDP port for that extra channel (allow it in Windows Firewall on every PC)
Port=27787
; How often your numbers are sent to the others, milliseconds
SendIntervalMs=1000

; ---- in-game overlay ----
; 0 = no overlay at all (reports are still written)
Overlay=1
; size in percent (100 = normal)
OverlayScale=100
; live damage panel at the right edge: 1 = shown at start, toggle with LivePanelKey
LivePanel=1
; 1 = show the scoreboard on the game's mission result screen
ScoreboardOnResult=1
; virtual-key codes: 0x75 = F6 (live panel), 0x76 = F7 (scoreboard)
LivePanelKey=0x75
ScoreboardKey=0x76

; ---- keys and debugging ----
; virtual-key codes: 0x78 = F9 (write results now), 0x79 = F10 (start counting anew)
SummaryKey=0x78
ResetKey=0x79
; 1 = also write every hit to EDFStats.log (debug only, costs performance)
LogHits=0
